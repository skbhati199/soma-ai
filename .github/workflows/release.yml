name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Release (${{ matrix.os }}, ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux (glibc)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: soma

          # Linux (musl - static)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: soma

          # Windows
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: soma.exe

          # macOS Intel
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: soma

          # macOS Apple Silicon
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: soma

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Linux musl)
        if: matrix.os == 'ubuntu-latest' && matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools musl-dev

      - name: Install dependencies (Linux glibc)
        if: matrix.os == 'ubuntu-latest' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --features inference,clipboard,completions

      - name: Prepare artifact
        run: |
          mkdir -p release
          cp target/${{ matrix.target }}/release/${{ matrix.artifact }} release/
          cd release
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            zip -9 soma-${{ matrix.target }}.zip ${{ matrix.artifact }}
            echo "ASSET=soma-${{ matrix.target }}.zip" >> $GITHUB_ENV
          else
            tar -czf soma-${{ matrix.target }}.tar.gz ${{ matrix.artifact }}
            echo "ASSET=soma-${{ matrix.target }}.tar.gz" >> $GITHUB_ENV
          fi

      - name: Generate checksums
        run: |
          cd release
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release/${{ env.ASSET }}
            release/checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false
