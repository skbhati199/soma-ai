name: Release macOS

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-macos-intel:
    name: Release macOS (Intel)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: macos-intel-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release --target x86_64-apple-darwin --features inference,clipboard,completions

      - name: Prepare artifact
        run: |
          mkdir -p release
          cp target/x86_64-apple-darwin/release/soma release/
          cd release
          tar -czf soma-x86_64-apple-darwin.tar.gz soma
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/soma-x86_64-apple-darwin.tar.gz
            release/checksums.txt
          generate_release_notes: true

  release-macos-arm:
    name: Release macOS (Apple Silicon)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: macos-arm-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release --target aarch64-apple-darwin --features inference,clipboard,completions

      - name: Prepare artifact
        run: |
          mkdir -p release
          cp target/aarch64-apple-darwin/release/soma release/
          cd release
          tar -czf soma-aarch64-apple-darwin.tar.gz soma
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/soma-aarch64-apple-darwin.tar.gz
            release/checksums.txt
          generate_release_notes: true

  release-macos-universal:
    name: Release macOS (Universal Binary)
    runs-on: macos-latest
    needs: [release-macos-intel, release-macos-arm]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Intel artifact
        uses: actions/download-artifact@v4
        with:
          name: soma-x86_64-apple-darwin
          path: artifacts/intel

      - name: Download ARM artifact
        uses: actions/download-artifact@v4
        with:
          name: soma-aarch64-apple-darwin
          path: artifacts/arm

      - name: Create Universal Binary
        run: |
          mkdir -p release
          lipo -create \
            artifacts/intel/soma \
            artifacts/arm/soma \
            -output release/soma
          cd release
          tar -czf soma-universal-apple-darwin.tar.gz soma
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/soma-universal-apple-darwin.tar.gz
            release/checksums.txt
          generate_release_notes: true