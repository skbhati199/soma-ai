name: Release Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-windows:
    name: Release Windows (MSVC)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: windows-msvc-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc --features inference,clipboard,completions

      - name: Prepare artifact
        shell: pwsh
        run: |
          mkdir -p release
          cp target\x86_64-pc-windows-msvc\release\soma.exe release\
          cd release
          Compress-Archive -Path soma.exe -DestinationPath soma-x86_64-pc-windows-msvc.zip -Force
          Get-FileHash -Algorithm SHA256 * | Out-File checksums.txt
          cat checksums.txt

      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/soma-x86_64-pc-windows-msvc.zip
            release/checksums.txt
          generate_release_notes: true