[package]
name = "soma"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Local AI terminal command assistant - single binary"
repository = "https://github.com/skbhati199/soma-ai"
readme = "README.md"
keywords = ["ai", "terminal", "cli", "llm", "powershell", "bash"]
categories = ["command-line-utilities", "development-tools"]

[features]
default = ["inference", "clipboard", "completions"]
inference = ["llama-cpp-2"]
clipboard = ["arboard"]
completions = ["clap_complete"]
embedded-model = []

[dependencies]
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
figment = { version = "0.11", features = ["toml", "env", "serde"] }
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5.0"
which = "5.0"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"] }
sha2 = "0.10"
indicatif = "0.17"
arboard = { version = "3.3", optional = true }
clap_complete = { version = "4.5", optional = true }
llama-cpp-2 = { version = "0.8", optional = true, features = ["default"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = "z"

[profile.release-with-debug]
inherits = "release"
debug = true

[workspace]
members = []