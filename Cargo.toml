[package]
name = "soma"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Local AI terminal command assistant - single binary"
repository = "https://github.com/skbhati199/soma-ai"
documentation = "https://github.com/skbhati199/soma-ai#readme"
homepage = "https://github.com/skbhati199/soma-ai"
readme = "README.md"
keywords = ["ai", "terminal", "cli", "llm", "powershell", "bash", "command-assistant", "local-llm"]
categories = ["command-line-utilities", "development-tools", "development-tools::debugging"]

[package.metadata]
# For cargo-dist / cargo-release
github-repo = "skbhati199/soma-ai"

# For npm package metadata
npm-name = "soma-ai"
npm-scope = "skbhati199"

[features]
default = ["inference", "clipboard", "completions"]
inference = ["llama-cpp-2"]
clipboard = ["arboard"]
completions = ["clap_complete"]
embedded-model = []

[dependencies]
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
figment = { version = "0.10", features = ["toml", "env", "serde_json"] }
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "7.0"
which = "5.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"
hex = "0.4"
indicatif = "0.17"
serde_json = "1.0"
toml = "0.8"
serde_yaml = "0.9"
arboard = { version = "3.3", optional = true }
clap_complete = { version = "4.5", optional = true }
llama-cpp-2 = { version = "0.1", optional = true, features = ["default"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = "z"

[profile.release-with-debug]
inherits = "release"
debug = true

[build-dependencies]
chrono = { version = "0.4", features = ["serde"] }

[workspace]
members = []
